<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 450" role="img">
<title>系统架构：桌面端与 Web 共用一套服务端，Agent 引擎只做推理编排</title>
<desc>客户端经 HTTPS 与 SSE 调用业务 API；业务 API 调用基于 pi 的 Agent 引擎，读写数据层，并把定时与长任务交给 Worker；Agent 引擎调用大模型与 Xinference，Worker 同步招聘平台的职位与投递状态</desc>
<style>
svg{color:#2c2c2a}
.t,.th,.ts{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:currentColor}
.t,.th{font-size:14px}.th{font-weight:500}.ts{font-size:12px}
.arr{stroke:currentColor;stroke-width:1.5;fill:none}
.box{fill:none;stroke:currentColor;stroke-width:.5;stroke-dasharray:4 3}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){svg{color:#c2c0b6}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="250" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">客户端</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Electron · Web</text></g>

<rect class="box" x="40" y="150" width="600" height="210" rx="12"/>
<text class="th" x="56" y="174">服务端 · Docker Compose</text>

<g class="c-teal"><rect x="250" y="180" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central">业务 API</text>
<text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">Fastify · SSE</text></g>
<g class="c-teal"><rect x="70" y="280" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="298" text-anchor="middle" dominant-baseline="central">任务 Worker</text>
<text class="ts" x="150" y="318" text-anchor="middle" dominant-baseline="central">BullMQ · 定时</text></g>
<g class="c-purple"><rect x="260" y="280" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="298" text-anchor="middle" dominant-baseline="central">Agent 引擎</text>
<text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">pi-ai · agent</text></g>
<g class="c-gray"><rect x="450" y="280" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="298" text-anchor="middle" dominant-baseline="central">数据层</text>
<text class="ts" x="530" y="318" text-anchor="middle" dominant-baseline="central">PG · Redis</text></g>

<line class="arr" x1="340" y1="98" x2="340" y2="178" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="124" dominant-baseline="central">HTTPS · SSE</text>
<line class="arr" x1="340" y1="238" x2="340" y2="278" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="258" dominant-baseline="central">调用</text>
<path class="arr" d="M432 208 L530 208 L530 278" marker-end="url(#arrow)"/>
<text class="ts" x="540" y="243" dominant-baseline="central">读写</text>
<path class="arr" d="M248 208 L150 208 L150 278" marker-end="url(#arrow)"/>
<text class="ts" x="100" y="243" dominant-baseline="central">入队</text>

<line class="arr" x1="150" y1="338" x2="150" y2="396" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="378" dominant-baseline="central">同步职位与状态</text>
<text class="ts" x="150" y="410" text-anchor="middle" dominant-baseline="central">招聘平台 API</text>
<line class="arr" x1="340" y1="338" x2="340" y2="396" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="378" dominant-baseline="central">推理 · 嵌入</text>
<text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central">大模型 API · Xinference</text>
</svg>
