<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 330" role="img">
<title>两个版本共用一个核心，只换适配器</title>
<desc>共享核心包含领域逻辑、Agent 与 API；本地版注入 PGlite、进程内队列和本机文件，云端版注入 PostgreSQL、Redis 和多租户；本地版可选登录云端同步数据并拉取职位库</desc>
<style>
svg{color:#2c2c2a}
.t,.th,.ts{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:currentColor}
.t,.th{font-size:14px}.th{font-weight:500}.ts{font-size:12px}
.arr{stroke:currentColor;stroke-width:1.5;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
@media (prefers-color-scheme:dark){svg{color:#c2c0b6}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-purple"><rect x="230" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">共享核心</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">领域 · Agent · API</text></g>
<g class="c-teal"><rect x="90" y="180" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="198" text-anchor="middle" dominant-baseline="central">本地版</text>
<text class="ts" x="180" y="218" text-anchor="middle" dominant-baseline="central">Electron 内嵌</text></g>
<g class="c-coral"><rect x="410" y="180" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="198" text-anchor="middle" dominant-baseline="central">云端版</text>
<text class="ts" x="500" y="218" text-anchor="middle" dominant-baseline="central">Docker 多租户</text></g>

<path class="arr" d="M300 98 L300 140 L180 140 L180 178" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="160" dominant-baseline="central">注入本地适配器</text>
<path class="arr" d="M380 98 L380 140 L500 140 L500 178" marker-end="url(#arrow)"/>
<text class="ts" x="510" y="160" dominant-baseline="central">注入云端适配器</text>
<line class="arr" x1="272" y1="208" x2="408" y2="208" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="194" text-anchor="middle">可选登录同步</text>

<text class="ts" x="180" y="262" text-anchor="middle" dominant-baseline="central">PGlite · 进程内队列 · 本机文件</text>
<text class="ts" x="180" y="282" text-anchor="middle" dominant-baseline="central">自带模型 Key 或本地模型</text>
<text class="ts" x="500" y="262" text-anchor="middle" dominant-baseline="central">PostgreSQL · Redis · 多租户</text>
<text class="ts" x="500" y="282" text-anchor="middle" dominant-baseline="central">平台模型额度 · HR 工作台</text>
</svg>
