<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img">
<title>投递状态机：每次迁移都触发提醒，终态回流匹配</title>
<desc>投递记录从待投递经已投递、已读、面试中到已结束；已读后也可直接未通过；超时未读触发跟进提醒；已结束的结果回流到匹配与简历复盘</desc>
<style>
svg{color:#2c2c2a}
.t,.th,.ts{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:currentColor}
.t,.th{font-size:14px}.th{font-weight:500}.ts{font-size:12px}
.arr{stroke:currentColor;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){svg{color:#c2c0b6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="50" y="60" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="78" text-anchor="middle" dominant-baseline="central">待投递</text>
<text class="ts" x="100" y="98" text-anchor="middle" dominant-baseline="central">匹配报告</text></g>
<g class="c-teal"><rect x="210" y="60" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="260" y="78" text-anchor="middle" dominant-baseline="central">已投递</text>
<text class="ts" x="260" y="98" text-anchor="middle" dominant-baseline="central">一键 / 辅助</text></g>
<g class="c-teal"><rect x="370" y="60" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="420" y="78" text-anchor="middle" dominant-baseline="central">已读</text>
<text class="ts" x="420" y="98" text-anchor="middle" dominant-baseline="central">平台回执</text></g>
<g class="c-teal"><rect x="530" y="60" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="78" text-anchor="middle" dominant-baseline="central">面试中</text>
<text class="ts" x="580" y="98" text-anchor="middle" dominant-baseline="central">日程提醒</text></g>
<g class="c-coral"><rect x="520" y="200" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="218" text-anchor="middle" dominant-baseline="central">已结束</text>
<text class="ts" x="580" y="238" text-anchor="middle" dominant-baseline="central">录用 · 未通过</text></g>

<line class="arr" x1="152" y1="88" x2="208" y2="88" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="74" text-anchor="middle">确认投递</text>
<line class="arr" x1="312" y1="88" x2="368" y2="88" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="74" text-anchor="middle">HR 查看</text>
<line class="arr" x1="472" y1="88" x2="528" y2="88" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="74" text-anchor="middle">邀约</text>
<line class="arr" x1="580" y1="118" x2="580" y2="198" marker-end="url(#arrow)"/>
<text class="ts" x="590" y="158" dominant-baseline="central">出结果</text>
<path class="arr" d="M420 118 L420 228 L518 228" marker-end="url(#arrow)"/>
<text class="ts" x="440" y="214" dominant-baseline="central">未通过</text>
<text class="ts" x="260" y="140" text-anchor="middle" dominant-baseline="central">超 7 天未读则提醒</text>
<line class="arr" x1="580" y1="258" x2="580" y2="286" marker-end="url(#arrow)"/>
<text class="ts" x="580" y="300" text-anchor="middle" dominant-baseline="central">回流匹配与复盘</text>
</svg>
