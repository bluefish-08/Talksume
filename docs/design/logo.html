<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简聊 · 标志方案</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F8FC}
</style>

<div style="width: 1440px; height: 700px; box-sizing: border-box; padding: 48px; background: #F5F8FC; color: #0F1B2E; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">

  <section style="background: #FFFFFF; border: 2px solid #2563EB; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 600">A · 引号</span>
      <span style="font-size: 12px; color: #1D4ED8; font-weight: 500">推荐</span>
    </div>
    <div style="height: 150px; display: flex; align-items: center; justify-content: center">
      <div style="display: flex; align-items: flex-start; gap: 2px">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M17 3.5H6.5V16"></path></svg>
        <span style="font-size: 54px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.05; padding-top: 6px">简聊</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 20px; border-top: 1px solid #E3E9F2; padding-top: 20px">
      <div style="display: flex; align-items: flex-start; gap: 1px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="3.4" stroke-linecap="square" aria-hidden="true"><path d="M17 3.5H6.5V16"></path></svg>
        <span style="font-size: 18px; font-weight: 700; line-height: 1.1; padding-top: 2px">简聊</span>
      </div>
      <span style="flex: 1"></span>
      <div role="img" aria-label="应用图标" style="width: 56px; height: 56px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE5F1; position: relative">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke-width="4.5" stroke-linecap="square" aria-hidden="true"><path d="M30 14H15v17" stroke="#2563EB"></path><path d="M26 42h15V25" stroke="#0F1B2E"></path></svg>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #4A5A72">中文引号「」= 引用你的原话。简历里每一句都出自你说过的话，标志本身讲的就是产品承诺。字标与图标同源，小尺寸也清楚。</p>
  </section>

  <section style="background: #FFFFFF; border: 1px solid #E3E9F2; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 24px">
    <span style="font-size: 15px; font-weight: 600">B · 会说话的纸</span>
    <div style="height: 150px; display: flex; align-items: center; justify-content: center; gap: 16px">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v11a1 1 0 0 1-1 1h-8l-4 3v-3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M15 3v4h4"></path><path d="M9 10.5h6M9 14h4"></path></svg>
      <span style="font-size: 50px; font-weight: 600; letter-spacing: 0.02em">简聊</span>
    </div>
    <div style="display: flex; align-items: center; gap: 20px; border-top: 1px solid #E3E9F2; padding-top: 20px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v11a1 1 0 0 1-1 1h-8l-4 3v-3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M15 3v4h4"></path></svg>
        <span style="font-size: 17px; font-weight: 600">简聊</span>
      </div>
      <span style="flex: 1"></span>
      <div role="img" aria-label="应用图标" style="width: 56px; height: 56px; border-radius: 14px; background: #EDF3FE; display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v11a1 1 0 0 1-1 1h-8l-4 3v-3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M15 3v4h4"></path></svg>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #4A5A72">简历纸的折角 + 对话气泡的尾巴，一眼看出「聊出简历」。直观，但图形语言比较常见。</p>
  </section>

  <section style="background: #FFFFFF; border: 1px solid #E3E9F2; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 24px">
    <span style="font-size: 15px; font-weight: 600">C · 纯字标</span>
    <div style="height: 150px; display: flex; align-items: center; justify-content: center; gap: 18px">
      <span style="font-size: 50px; font-weight: 600; letter-spacing: 0.04em">简聊</span>
      <span style="width: 1px; height: 44px; background: #C9D5E6"></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #4A5A72">talksume</span>
    </div>
    <div style="display: flex; align-items: center; gap: 20px; border-top: 1px solid #E3E9F2; padding-top: 20px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em">简聊</span>
        <span style="width: 1px; height: 14px; background: #C9D5E6"></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5A72">talksume</span>
      </div>
      <span style="flex: 1"></span>
      <div role="img" aria-label="应用图标" style="width: 56px; height: 56px; border-radius: 14px; background: #0F1B2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; letter-spacing: 0.04em">简聊</div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #4A5A72">不放图形，只靠字体和排版，最安静。缺点是没有独立图标，桌面端 Dock 和浏览器标签页上辨识度一般。</p>
  </section>
</div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#1D4ED8","#3B6FE0","#0B63CE"]},"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2563EB' };
  }
}
</script>
</body>
</html>
