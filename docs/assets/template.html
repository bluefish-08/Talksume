<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$title$ $title-en$ · $doctype$</title>
$for(css)$
<link rel="stylesheet" href="$css$">
$endfor$
</head>
<body>
<article class="sheet">
<header class="cover">
  <div class="kicker">$kicker$</div>
  <div class="brand">
    <h1>$title$<span class="en">$title-en$</span></h1>
    <p class="subtitle">$subtitle$</p>
  </div>
  <p class="tagline">$tagline$</p>
  <dl class="meta">
    <div><dt>文档</dt><dd>$doctype$</dd></div>
    <div><dt>版本</dt><dd>$version$</dd></div>
    <div><dt>日期</dt><dd>$date$</dd></div>
  </dl>
</header>
$if(toc)$
<nav class="toc" aria-label="目录"><div class="toc-title">目录</div>$table-of-contents$</nav>
$endif$
<main>
$body$
</main>
</article>
<script src="assets/mermaid.min.js"></script>
<script>
(async () => {
  document.querySelectorAll('pre.mermaid').forEach(pre => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = pre.textContent;
    pre.replaceWith(div);
  });
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    er: { layoutDirection: 'LR', useMaxWidth: true },
    themeVariables: {
      fontFamily: '"PingFang SC","Noto Sans SC",system-ui,sans-serif',
      fontSize: '14px',
      primaryColor: '#E1F5EE',
      primaryBorderColor: '#0F6E56',
      primaryTextColor: '#085041',
      lineColor: '#5F5E5A',
      tertiaryColor: '#F1EFE8'
    }
  });
  await mermaid.run();
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
